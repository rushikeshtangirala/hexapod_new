# =============================================================================
# controllers.yaml : controller_manager configuration for the hexapod
# =============================================================================
# STRUCTURE
# Two levels. The `controller_manager` block DECLARES which controllers exist
# and what plugin type each is. Each controller then gets its OWN top-level
# block, named exactly as declared, holding its parameters.
#
# Getting that wrong is the most common ros2_control mistake: a parameter
# block nested inside controller_manager is silently ignored, and the
# controller fails to configure complaining about missing 'joints'.
#
# TWO CONTROLLERS ARE DEFINED, ONE IS SPAWNED
#   leg_trajectory_controller  effort  commands, for the free-base robot
#   leg_position_controller    position commands, for the fixed-base demo
# The launch file spawns whichever matches control_mode. Declaring both here
# costs nothing: an unspawned controller is inert.
# =============================================================================

controller_manager:
  ros__parameters:

    # Control loop rate, Hz. Physics runs at 1000 Hz (max_step_size 0.001),
    # so 200 Hz is one control update per 5 physics steps.
    #
    # Setting this above the physics rate is pointless: the extra writes are
    # overwritten before anything reads them. 200 Hz is also honest about
    # hardware, where a serial servo bus manages 50 to 200 Hz depending on
    # baud rate and chain length.
    update_rate: 200
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # EFFORT path. joint_trajectory_controller is used rather than a simple
    # forward controller because it is the only stock ros2_controller that
    # closes a POSITION loop over an EFFORT interface. We feed it single
    # trajectory points at 50 Hz; it runs the PID that turns position error
    # into joint torque.
    leg_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # POSITION path.
    #
    # This was position_controllers/JointGroupPositionController, and that
    # was the cause of the robot being catapulted out of the world on spawn.
    #
    # THE FAILURE, IN FULL, BECAUSE IT IS SUBTLE
    # <param name="initial_value"> applies to the STATE interface only. The
    # gazebo log shows it under "State:" and never under "Command:". So the
    # joint is PLACED at its stance angle, but the position COMMAND buffer
    # starts at zero.
    #
    # A ForwardCommandController writes nothing until it receives a message,
    # so on the very first physics step GazeboSystem reads that zeroed
    # command buffer and teleports all 18 joints from the stance pose to
    # 0 rad. The legs snap straight out sideways while the feet are loaded,
    # and the contact solver ejects the robot at enormous speed.
    #
    # It explains every observation we collected:
    #   controllers:=false  -> stable   (nothing writes, no teleport)
    #   fix_base:=true      -> stable   (base welded, teleport cannot move it)
    #   stance femur 69.9   -> drift    (smaller teleport)
    #   stance femur 92.8   -> ejection (larger teleport)
    #
    # JointTrajectoryController does not have this behaviour: on activation
    # it READS THE CURRENT JOINT STATE and holds it. There is no zero to jump
    # to. It also gives the two control modes one shape, so the gait node
    # publishes the same message type either way.
    #
    # No PID gains here: over a position command interface JTC passes the
    # interpolated setpoint straight through.
    leg_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController


# =============================================================================
# EFFORT controller
# =============================================================================
leg_trajectory_controller:
  ros__parameters:
    joints:
      - lf_coxa_joint
      - lf_femur_joint
      - lf_tibia_joint
      - lm_coxa_joint
      - lm_femur_joint
      - lm_tibia_joint
      - lr_coxa_joint
      - lr_femur_joint
      - lr_tibia_joint
      - rf_coxa_joint
      - rf_femur_joint
      - rf_tibia_joint
      - rm_coxa_joint
      - rm_femur_joint
      - rm_tibia_joint
      - rr_coxa_joint
      - rr_femur_joint
      - rr_tibia_joint

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    # We stream one trajectory point per control cycle rather than sending a
    # long trajectory once, because the gait is regenerated continuously from
    # the velocity command. Each new message replaces the previous one.
    # Without this, JTC rejects every point for having a non-zero velocity at
    # the trajectory end.
    allow_nonzero_velocity_at_trajectory_end: true

    # Closed loop: the PID acts on measured state. open_loop_control:true
    # would integrate the commanded trajectory instead and never correct for
    # actual load, which defeats the point of moving to effort control.
    open_loop_control: false

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0

    # =========================================================================
    # PID GAINS
    #
    # These convert position error into joint torque. Sizing rather than
    # guessing:
    #
    #   p : torque per radian of error. The femur must hold about 2.45 N*m
    #       in stance (see the static torque check in
    #       common_properties.xacro). Accepting ~0.006 rad of droop under
    #       that load gives p = 2.45 / 0.006 = 408, so 500 is the right
    #       order of magnitude. Too low and the robot visibly sags; too high
    #       and it oscillates.
    #
    #   d : damping. Critical damping is d = 2*sqrt(p*J). With effective
    #       joint inertia J of roughly 0.005 kg*m^2 for a femur carrying a
    #       tibia, that is 2*sqrt(500*0.005) = 3.2, so 6 is comfortably
    #       overdamped. Prefer overdamped here: an oscillating leg pumps
    #       energy into the contacts and undoes everything.
    #
    #   i : removes steady-state droop, which matters because the legs bear
    #       weight continuously. i_clamp bounds the wind-up so a leg that is
    #       briefly blocked does not store torque and then release it.
    #
    # Gains differ by SEGMENT, not by leg, because all six legs are
    # identical. Coxa carries little load (it swings the leg horizontally),
    # femur carries the most, tibia is in between.
    #
    # TUNING ORDER if the robot misbehaves:
    #   sags under its own weight     -> raise p on femur and tibia
    #   visibly oscillates or buzzes  -> raise d, then lower p
    #   slowly settles low but steady -> raise i
    # Change one segment at a time and watch /joint_states against the
    # commanded trajectory.
    # =========================================================================
    # REVISION 3. The gains come DOWN, not up, and the integral term is what
    # holds the weight.
    #
    # Revision 2 reasoned "it sags, so raise p" and went 500 -> 1500. That
    # treats droop as the only failure mode. It is not. There is a ceiling on
    # p set by the CONTROL RATE, and revision 2 went straight through it.
    #
    # THE SAMPLING LIMIT
    # A joint under proportional control is a second-order system with
    # natural frequency
    #
    #     w = sqrt(p / J)
    #
    # and a discrete controller can only follow an oscillation it samples
    # often enough. Below about eight samples per period the derivative term
    # is differentiating noise and the loop rings instead of settling; below
    # about four it diverges. This is the same argument as the contact
    # stiffness note in hexapod.world, applied to the controller rather than
    # to the ground.
    #
    # The inertia that matters is the SWING inertia, because that is when the
    # leg is light and the loop is fastest. About the femur axis:
    #
    #     femur  0.143 kg at 0.060 m  ->  5.1e-4 + 1.7e-4  =  6.8e-4
    #     tibia  0.056 kg at 0.175 m  ->  1.7e-3 + 0.6e-4  =  1.8e-3
    #                                     J = 2.5e-3 kg m^2
    #
    # At p = 1500 that gives w = sqrt(1500/0.0025) = 775 rad/s = 123 Hz.
    # The control loop runs at 200 Hz. That is 1.6 samples per period: not
    # marginal, simply outside what the loop can represent. In stance the
    # effective inertia is roughly ten times higher and the joint behaves,
    # which is exactly why the fault only appeared with the base free and the
    # legs swinging.
    #
    # THE CHOICE
    # Ten samples per period at 200 Hz means w <= 125 rad/s, so
    #
    #     p <= J w^2 = 0.0025 * 125^2 = 39   (swing)
    #
    # and the stance case allows roughly ten times that. Sitting near the
    # stance limit, around 120 to 160, keeps swing at six to eight samples
    # per period. An independent check agrees: controllers_repo.yaml, taken
    # from a published hexapod of similar scale, uses p = 100 on every joint.
    # Two unrelated routes to the same order of magnitude is worth more than
    # either on its own.
    #
    # WHAT THEN HOLDS THE ROBOT UP
    # The integral term, which is what it is for. Gravity at the femur is
    # about 1.5 N*m: 2.99 kg total on three stance feet is 9.8 N per foot,
    # acting at a horizontal arm of 0.190 - 0.061 = 0.129 m, plus the leg's
    # own weight. That load is CONSTANT, so an integrator cancels it exactly
    # and leaves no steady droop at all, whereas proportional gain can only
    # ever reduce it. i_clamp is set above the required torque and below the
    # 7 N*m joint limit, so the integrator can do the job but cannot wind up
    # into a saturated command.
    #
    # d is critical damping, 2*sqrt(p*J), evaluated between the swing and
    # stance inertias and rounded up: slightly overdamped is the right side
    # to err on when the plant inertia changes by a factor of ten twice per
    # gait cycle.
    #
    # HEADROOM. At p = 160 the 7 N*m limit needs 0.044 rad of error, about
    # 2.5 degrees. Tracking error that large means something is wrong, so
    # saturation is now a genuine fault signal rather than a routine event.
    # Under revision 2 it was reached at a third of a degree, which meant the
    # joints were saturating during ordinary swings and the PID was not
    # really acting as a PID at all.

    # ff_velocity_scale, one per joint, INSIDE this joint's gains map.
    #
    # The controller was logging, eighteen times on every start:
    #   'ff_velocity_scale' parameters is not defined under 'gains.<joint_name>.'
    #   structure. Maybe you are using deprecated format 'ff_velocity_scale/<joint>'
    #
    # It was not a cosmetic warning. The parameter was absent in the form this
    # controller version reads, so the feedforward term defaulted to zero and
    # the velocity feedforward described in ARCHITECTURE.md was silently
    # inactive for every run recorded so far.
    #
    # Why it matters under EFFORT control specifically: a pure PID lags a
    # moving target by however much position error is needed to generate the
    # driving torque. Supplying the expected velocity lets the controller
    # anticipate rather than chase. gait.py already computes those velocities
    # by finite difference and the gait node already publishes them, so the
    # information was being sent and thrown away.
    #
    # 1.0 means use the commanded velocity as given. Lower it if the joints
    # overshoot on fast swings.
    gains:
      lf_coxa_joint:  {p: 120.0, i: 8.0,  d: 2.0, i_clamp: 2.0, ff_velocity_scale: 1.0}
      lf_femur_joint: {p: 160.0, i: 30.0, d: 3.0, i_clamp: 5.0, ff_velocity_scale: 1.0}
      lf_tibia_joint: {p: 130.0, i: 25.0, d: 2.5, i_clamp: 4.0, ff_velocity_scale: 1.0}
      lm_coxa_joint:  {p: 120.0, i: 8.0,  d: 2.0, i_clamp: 2.0, ff_velocity_scale: 1.0}
      lm_femur_joint: {p: 160.0, i: 30.0, d: 3.0, i_clamp: 5.0, ff_velocity_scale: 1.0}
      lm_tibia_joint: {p: 130.0, i: 25.0, d: 2.5, i_clamp: 4.0, ff_velocity_scale: 1.0}
      lr_coxa_joint:  {p: 120.0, i: 8.0,  d: 2.0, i_clamp: 2.0, ff_velocity_scale: 1.0}
      lr_femur_joint: {p: 160.0, i: 30.0, d: 3.0, i_clamp: 5.0, ff_velocity_scale: 1.0}
      lr_tibia_joint: {p: 130.0, i: 25.0, d: 2.5, i_clamp: 4.0, ff_velocity_scale: 1.0}
      rf_coxa_joint:  {p: 120.0, i: 8.0,  d: 2.0, i_clamp: 2.0, ff_velocity_scale: 1.0}
      rf_femur_joint: {p: 160.0, i: 30.0, d: 3.0, i_clamp: 5.0, ff_velocity_scale: 1.0}
      rf_tibia_joint: {p: 130.0, i: 25.0, d: 2.5, i_clamp: 4.0, ff_velocity_scale: 1.0}
      rm_coxa_joint:  {p: 120.0, i: 8.0,  d: 2.0, i_clamp: 2.0, ff_velocity_scale: 1.0}
      rm_femur_joint: {p: 160.0, i: 30.0, d: 3.0, i_clamp: 5.0, ff_velocity_scale: 1.0}
      rm_tibia_joint: {p: 130.0, i: 25.0, d: 2.5, i_clamp: 4.0, ff_velocity_scale: 1.0}
      rr_coxa_joint:  {p: 120.0, i: 8.0,  d: 2.0, i_clamp: 2.0, ff_velocity_scale: 1.0}
      rr_femur_joint: {p: 160.0, i: 30.0, d: 3.0, i_clamp: 5.0, ff_velocity_scale: 1.0}
      rr_tibia_joint: {p: 130.0, i: 25.0, d: 2.5, i_clamp: 4.0, ff_velocity_scale: 1.0}


# =============================================================================
# POSITION controller
# =============================================================================
# Commanded via /leg_position_controller/joint_trajectory (JointTrajectory),
# not a Float64MultiArray. Joint order below is the order of values in each
# trajectory point.
leg_position_controller:
  ros__parameters:
    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    # We stream one point per control cycle, each replacing the last, because
    # the gait is regenerated continuously. Without this JTC rejects every
    # point for having non-zero velocity at the trajectory end.
    allow_nonzero_velocity_at_trajectory_end: true
    open_loop_control: false

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0

    joints:
      - lf_coxa_joint
      - lf_femur_joint
      - lf_tibia_joint
      - lm_coxa_joint
      - lm_femur_joint
      - lm_tibia_joint
      - lr_coxa_joint
      - lr_femur_joint
      - lr_tibia_joint
      - rf_coxa_joint
      - rf_femur_joint
      - rf_tibia_joint
      - rm_coxa_joint
      - rm_femur_joint
      - rm_tibia_joint
      - rr_coxa_joint
      - rr_femur_joint
      - rr_tibia_joint


joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false
